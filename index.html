<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Club Fidelidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary: #5b3cf5;
    --primary-light: #7b5ff7;
    --primary-dark: #3d22d4;
    --secondary: #ff6b6b;
    --accent: #ffd166;
    --teal: #06d6a0;
    --bg: #f4f2ff;
    --bg2: #ffffff;
    --surface: #ffffff;
    --surface2: #f8f7ff;
    --border: #e8e4ff;
    --text: #1a1635;
    --text-muted: #8b86aa;
    --text-soft: #5c567a;
    --success: #06d6a0;
    --error: #ff6b6b;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 4px 24px rgba(91,60,245,0.10);
    --shadow-lg: 0 8px 40px rgba(91,60,245,0.16);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 80% 10%, rgba(91,60,245,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 10% 90%, rgba(6,214,160,0.07) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  #app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 80px;
  }
  header {
    width: 100%;
    max-width: 480px;
    text-align: center;
    padding: 48px 0 32px;
    margin-bottom: 24px;
  }
  .logo-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: 20px;
    margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(91,60,245,0.3);
  }
  .logo-wrap svg { width: 32px; height: 32px; fill: white; }
  h1 {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(28px, 7vw, 36px);
    font-weight: 900;
    color: var(--text);
    letter-spacing: -0.5px;
    line-height: 1.1;
  }
  .tagline { margin-top: 6px; font-size: 14px; color: var(--text-muted); font-weight: 500; }
  .tagline span {
    display: inline-block;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
  }
  .view { width: 100%; max-width: 480px; display: none; }
  .view.active { display: block; animation: fadeUp 0.3s ease forwards; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .card-title {
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 20px;
  }
  .selector-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 8px;
  }
  .selector-btn {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: var(--shadow);
    font-family: 'Nunito', sans-serif;
  }
  .selector-btn:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .selector-btn .icon { font-size: 32px; margin-bottom: 10px; display: block; }
  .selector-btn .label { font-size: 14px; font-weight: 800; color: var(--text); display: block; }
  .selector-btn .sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; display: block; font-weight: 500; }
  .selector-btn.primary-btn { background: linear-gradient(135deg, var(--primary), var(--primary-light)); border-color: transparent; }
  .selector-btn.primary-btn .label, .selector-btn.primary-btn .sub { color: white; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 700; color: var(--text-soft); margin-bottom: 6px; letter-spacing: 0.03em; text-transform: uppercase; }
  input[type="text"], input[type="number"], input[type="password"] {
    width: 100%;
    background: var(--surface2);
    border: 2px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    padding: 13px 16px;
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
  }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(91,60,245,0.1); background: #fff; }
  input::placeholder { color: var(--text-muted); font-size: 14px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 15px 24px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 800;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; box-shadow: 0 4px 16px rgba(91,60,245,0.3); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(91,60,245,0.4); }
  .btn-secondary { background: var(--surface2); border: 2px solid var(--border); color: var(--primary); }
  .btn-secondary:hover { border-color: var(--primary); background: #f0edff; }
  .btn-danger { background: #fff0f0; border: none; color: var(--error); font-size: 12px; padding: 7px 12px; width: auto; border-radius: 8px; font-weight: 700; }
  .btn-ghost { background: transparent; color: var(--text-muted); font-size: 14px; padding: 10px; width: auto; font-weight: 600; }
  .btn-ghost:hover { color: var(--primary); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .section-tabs { display: flex; background: var(--surface2); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 16px; gap: 4px; }
  .section-tab { flex: 1; padding: 10px; text-align: center; font-size: 13px; font-weight: 800; cursor: pointer; color: var(--text-muted); background: transparent; border: none; border-radius: 8px; font-family: 'Nunito', sans-serif; transition: all 0.2s; }
  .section-tab.active { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(91,60,245,0.12); }
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--text);
    color: white;
    font-size: 14px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    padding: 14px 24px;
    border-radius: 40px;
    box-shadow: 0 8px 32px rgba(26,22,53,0.25);
    z-index: 1000;
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    max-width: 320px;
    text-align: center;
    white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success { background: var(--success); color: #003020; }
  #toast.error { background: var(--error); color: white; }
  .points-hero {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary), var(--primary-light));
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(91,60,245,0.3);
  }
  .points-hero::before { content: ''; position: absolute; top: -40px; right: -40px; width: 140px; height: 140px; background: rgba(255,255,255,0.07); border-radius: 50%; }
  .points-hero::after { content: ''; position: absolute; bottom: -60px; left: -20px; width: 180px; height: 180px; background: rgba(255,255,255,0.05); border-radius: 50%; }
  .points-label-top { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.7); margin-bottom: 8px; }
  .points-number { font-family: 'Nunito', sans-serif; font-size: 72px; font-weight: 900; color: white; line-height: 1; letter-spacing: -2px; position: relative; z-index: 1; }
  .points-suffix { font-size: 16px; font-weight: 700; color: rgba(255,255,255,0.75); margin-top: 4px; letter-spacing: 0.05em; text-transform: uppercase; }
  .client-info-card { background: var(--surface); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 16px; }
  .client-chip { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .client-chip:last-child { border-bottom: none; }
  .chip-icon { width: 36px; height: 36px; background: var(--surface2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .chip-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .chip-value { font-size: 14px; color: var(--text); font-weight: 700; margin-top: 1px; }
  .cat-header { font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: var(--primary); margin: 20px 0 10px; padding-left: 4px; }
  .product-item { display: flex; align-items: center; background: var(--surface); border-radius: var(--radius-sm); margin-bottom: 10px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 2px 10px rgba(91,60,245,0.05); transition: all 0.2s; }
  .product-item:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(91,60,245,0.12); }
  .product-img { width: 80px; height: 80px; object-fit: cover; flex-shrink: 0; }
  .product-img-placeholder { width: 80px; height: 80px; flex-shrink: 0; background: linear-gradient(135deg, #f0edff, #e8e4ff); display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .product-body { flex: 1; padding: 14px 12px; min-width: 0; }
  .product-name { font-size: 14px; color: var(--text); font-weight: 700; font-family: 'Nunito', sans-serif; }
  .product-desc { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .product-pts { padding: 14px 16px; text-align: center; flex-shrink: 0; }
  .product-pts .pts-num { font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 900; color: var(--primary); display: block; line-height: 1; }
  .product-pts .pts-text { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; }
  .top-bar { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; font-size: 12px; font-weight: 800; font-family: 'Nunito', sans-serif; padding: 6px 14px; border-radius: 40px; }
  .profile-row { background: var(--surface); border: 1px solid var(--border); padding: 16px; margin-bottom: 10px; border-radius: var(--radius-sm); box-shadow: 0 2px 10px rgba(91,60,245,0.05); }
  .profile-row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .profile-name { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; color: var(--text); }
  .profile-dni { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }
  .profile-points { text-align: right; }
  .profile-points .big { font-family: 'Nunito', sans-serif; font-size: 26px; font-weight: 900; color: var(--primary); line-height: 1; }
  .profile-points small { display: block; font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
  .add-pts-row { display: flex; gap: 8px; align-items: center; }
  .add-pts-row input { flex: 1; padding: 11px 14px; font-size: 14px; border-radius: 10px; }
  .add-pts-row .btn { width: auto; padding: 11px 18px; font-size: 13px; border-radius: 10px; white-space: nowrap; }
  .admin-product-item { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 8px; border-radius: var(--radius-sm); }
  .admin-product-info { flex: 1; min-width: 0; }
  .admin-product-name { font-size: 14px; font-weight: 700; color: var(--text); font-family: 'Nunito', sans-serif; }
  .admin-product-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .admin-product-pts { font-family: 'Nunito', sans-serif; font-size: 20px; color: var(--primary); font-weight: 900; white-space: nowrap; text-align: right; }
  .admin-product-pts small { display: block; font-family: 'DM Sans', sans-serif; font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
  .admin-thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
  .form-row { display: flex; gap: 10px; }
  .form-row .field { flex: 1; }
  .spinner { width: 22px; height: 22px; border: 3px solid rgba(91,60,245,0.15); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; display: block; margin: 24px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 14px; font-weight: 500; }
  .empty-state .emoji { font-size: 32px; display: block; margin-bottom: 8px; }
  #search-results { margin-top: 8px; }
  .back-area { text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo-wrap">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>
    </div>
    <h1>Club Fidelidad</h1>
    <p class="tagline"><span>Boutique</span> &nbsp;·&nbsp; Acumula y gana</p>
  </header>

  <div class="view active" id="view-selector">
    <div class="selector-grid">
      <button class="selector-btn primary-btn" onclick="showView('view-client')">
        <span class="icon">&#11088;</span>
        <span class="label">Soy Cliente</span>
        <span class="sub">Ver mis puntos</span>
      </button>
      <button class="selector-btn" onclick="promptAdmin()">
        <span class="icon">&#9881;&#65039;</span>
        <span class="label">Administrar</span>
        <span class="sub">Panel de gestion</span>
      </button>
    </div>
  </div>

  <div class="view" id="view-client">
    <div class="card">
      <p class="card-title">Ingresa al club</p>
      <div class="field"><label>Numero de DNI</label><input type="number" id="client-dni" placeholder="Ingresa tu DNI" /></div>
      <div class="field"><label>Tu nombre</label><input type="text" id="client-name" placeholder="Nombre completo" /></div>
      <button class="btn btn-primary" onclick="clientLogin()">Ingresar al club &rarr;</button>
    </div>
    <div class="back-area"><button class="btn btn-ghost" onclick="showView('view-selector')">&larr; Volver</button></div>
  </div>

  <div class="view" id="view-profile">
    <div class="section-tabs">
      <button class="section-tab active" id="tab-mis-puntos" onclick="clientTab('mis-puntos')">Mis puntos</button>
      <button class="section-tab" id="tab-catalogo" onclick="clientTab('catalogo')">Catalogo</button>
    </div>
    <div id="panel-mis-puntos">
      <div class="points-hero">
        <div class="points-label-top">Puntos acumulados</div>
        <div class="points-number" id="profile-pts">0</div>
        <div class="points-suffix">puntos</div>
      </div>
      <div class="client-info-card">
        <div class="client-chip">
          <div class="chip-icon">&#128100;</div>
          <div><div class="chip-label">Nombre</div><div class="chip-value" id="profile-name-display">-</div></div>
        </div>
        <div class="client-chip">
          <div class="chip-icon">&#128196;</div>
          <div><div class="chip-label">DNI</div><div class="chip-value" id="profile-dni-display">-</div></div>
        </div>
      </div>
    </div>
    <div id="panel-catalogo" style="display:none;">
      <div class="card">
        <p class="card-title">Productos y Beneficios</p>
        <div id="catalog-list"><span class="spinner"></span></div>
      </div>
    </div>
    <div class="back-area"><button class="btn btn-ghost" onclick="showView('view-client')">&larr; Salir</button></div>
  </div>

  <div class="view" id="view-admin-login">
    <div class="card">
      <p class="card-title">Acceso Administrador</p>
      <div class="field"><label>Contrasena</label><input type="password" id="admin-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter') verifyAdmin()" /></div>
      <button class="btn btn-primary" onclick="verifyAdmin()">Ingresar &rarr;</button>
    </div>
    <div class="back-area"><button class="btn btn-ghost" onclick="showView('view-selector')">&larr; Volver</button></div>
  </div>

  <div class="view" id="view-admin">
    <div class="top-bar">
      <span class="badge">Admin</span>
      <button class="btn btn-ghost" style="width:auto;padding:8px 14px;" onclick="adminLogout()">Salir &rarr;</button>
    </div>
    <div class="section-tabs">
      <button class="section-tab active" id="atab-clientes" onclick="adminTab('clientes')">Clientes</button>
      <button class="section-tab" id="atab-catalogo" onclick="adminTab('catalogo')">Catalogo</button>
    </div>
    <div id="apanel-clientes">
      <div class="card">
        <p class="card-title">Buscar cliente</p>
        <div class="field"><label>Nombre o DNI</label><input type="text" id="admin-search" placeholder="Escribi para buscar..." oninput="searchProfiles()" onkeydown="if(event.key==='Enter') searchProfiles(true)" /></div>
        <div id="search-results"></div>
      </div>
    </div>
    <div id="apanel-catalogo" style="display:none;">
      <div class="card">
        <p class="card-title">Agregar producto</p>
        <div class="field"><label>Nombre del producto</label><input type="text" id="new-nombre" placeholder="Ej: Remera Premium" /></div>
        <div class="form-row">
          <div class="field"><label>Categoria</label><input type="text" id="new-categoria" placeholder="Ej: Ropa" /></div>
          <div class="field"><label>Puntos</label><input type="number" id="new-puntos" placeholder="50" min="1" /></div>
        </div>
        <div class="field"><label>Descripcion (opcional)</label><input type="text" id="new-desc" placeholder="Breve descripcion..." /></div>
        <div class="field"><label>URL de imagen (opcional)</label><input type="text" id="new-imagen" placeholder="https://..." /></div>
        <button class="btn btn-primary" onclick="addProduct()">+ Agregar al catalogo</button>
      </div>
      <div class="card">
        <p class="card-title">Productos en catalogo</p>
        <div id="admin-catalog-list"><span class="spinner"></span></div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
const SB_URL="https://jskdumhuduxtyfzlrwcc.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impza2R1bWh1ZHV4dHlmemxyd2NjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NDI4ODksImV4cCI6MjA5MzMxODg4OX0.jWIrw0Szw7LzawUrhrNpySSEIHF5ttITjkbPrVkgnag";
const ADMIN_PASS="admin1234";
const H={"Content-Type":"application/json","apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`,"Prefer":"return=representation"};
async function sbGet(t,f=""){const r=await fetch(`${SB_URL}/rest/v1/${t}?${f}`,{headers:H});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbPost(t,b){const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:"POST",headers:H,body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbPatch(t,f,b){const r=await fetch(`${SB_URL}/rest/v1/${t}?${f}`,{method:"PATCH",headers:H,body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbDelete(t,f){const r=await fetch(`${SB_URL}/rest/v1/${t}?${f}`,{method:"DELETE",headers:H});if(!r.ok)throw new Error(await r.text());}
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');}
function promptAdmin(){showView('view-admin-login');document.getElementById('admin-pass').value='';}
let tt;
function toast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className=`show ${type}`;clearTimeout(tt);tt=setTimeout(()=>t.className='',3000);}
async function clientLogin(){
  const dni=document.getElementById('client-dni').value.trim();
  const name=document.getElementById('client-name').value.trim();
  if(!dni){toast('Ingresa tu DNI','error');return;}
  try{
    let[p]=await sbGet('perfiles',`dni=eq.${encodeURIComponent(dni)}&limit=1`);
    if(!p){if(!name){toast('Ingresa tu nombre para registrarte','error');return;}const res=await sbPost('perfiles',{dni,nombre:name,puntos:0});p=Array.isArray(res)?res[0]:res;toast('Bienvenido al club!','success');}
    document.getElementById('profile-pts').textContent=p.puntos??0;
    document.getElementById('profile-name-display').textContent=p.nombre||name;
    document.getElementById('profile-dni-display').textContent=p.dni;
    clientTab('mis-puntos');showView('view-profile');
  }catch(e){toast('Error de conexion','error');console.error(e);}
}
function clientTab(tab){
  document.getElementById('panel-mis-puntos').style.display=tab==='mis-puntos'?'block':'none';
  document.getElementById('panel-catalogo').style.display=tab==='catalogo'?'block':'none';
  document.getElementById('tab-mis-puntos').classList.toggle('active',tab==='mis-puntos');
  document.getElementById('tab-catalogo').classList.toggle('active',tab==='catalogo');
  if(tab==='catalogo')loadCatalog();
}
async function loadCatalog(){
  const el=document.getElementById('catalog-list');
  el.innerHTML='<span class="spinner"></span>';
  try{
    const rows=await sbGet('productos','order=categoria.asc,nombre.asc');
    if(!rows.length){el.innerHTML='<div class="empty-state"><span class="emoji">&#128235;</span>El catalogo esta vacio.</div>';return;}
    const groups={};
    rows.forEach(p=>{if(!groups[p.categoria])groups[p.categoria]=[];groups[p.categoria].push(p);});
    el.innerHTML=Object.entries(groups).map(([cat,prods])=>`
      <div class="cat-group">
        <div class="cat-header">${esc(cat)}</div>
        ${prods.map(p=>`
          <div class="product-item">
            ${p.imagen?`<img class="product-img" src="${esc(p.imagen)}" alt="${esc(p.nombre)}" onerror="this.style.display='none'" />`:`<div class="product-img-placeholder">&#127873;</div>`}
            <div class="product-body">
              <div class="product-name">${esc(p.nombre)}</div>
              ${p.descripcion?`<div class="product-desc">${esc(p.descripcion)}</div>`:''}
            </div>
            <div class="product-pts"><span class="pts-num">${p.puntos}</span><span class="pts-text">puntos</span></div>
          </div>`).join('')}
      </div>`).join('');
  }catch(e){el.innerHTML='<div class="empty-state">Error al cargar.</div>';}
}
function verifyAdmin(){
  if(document.getElementById('admin-pass').value===ADMIN_PASS){showView('view-admin');adminTab('clientes');toast('Bienvenido Admin','success');}
  else{toast('Contrasena incorrecta','error');}
}
function adminLogout(){showView('view-selector');}
function adminTab(tab){
  document.getElementById('apanel-clientes').style.display=tab==='clientes'?'block':'none';
  document.getElementById('apanel-catalogo').style.display=tab==='catalogo'?'block':'none';
  document.getElementById('atab-clientes').classList.toggle('active',tab==='clientes');
  document.getElementById('atab-catalogo').classList.toggle('active',tab==='catalogo');
  if(tab==='catalogo')loadAdminCatalog();
}
let st;
function searchProfiles(now=false){clearTimeout(st);if(now){_doSearch();return;}st=setTimeout(_doSearch,320);}
async function _doSearch(){
  const q=document.getElementById('admin-search').value.trim();
  const el=document.getElementById('search-results');
  if(!q){el.innerHTML='';return;}
  el.innerHTML='<span class="spinner"></span>';
  try{
    const isNum=/^\d+$/.test(q);
    const rows=isNum?await sbGet('perfiles',`dni=eq.${encodeURIComponent(q)}&order=nombre.asc`):await sbGet('perfiles',`nombre=ilike.*${encodeURIComponent(q)}*&order=nombre.asc&limit=20`);
    renderClients(rows);
  }catch(e){el.innerHTML='<div class="empty-state">Error al buscar.</div>';}
}
function renderClients(rows){
  const el=document.getElementById('search-results');
  if(!rows.length){el.innerHTML='<div class="empty-state">Sin resultados.</div>';return;}
  el.innerHTML=rows.map(p=>`
    <div class="profile-row">
      <div class="profile-row-top">
        <div><div class="profile-name">${esc(p.nombre)}</div><div class="profile-dni">DNI ${esc(p.dni)}</div></div>
        <div class="profile-points"><span class="big" id="pd-${esc(p.dni)}">${p.puntos??0}</span><small>puntos</small></div>
      </div>
      <div class="add-pts-row">
        <input type="number" id="pts-${esc(p.dni)}" placeholder="Puntos a sumar" min="1" onkeydown="if(event.key==='Enter') addPoints('${esc(p.dni)}')" />
        <button class="btn btn-primary" onclick="addPoints('${esc(p.dni)}')">+ Sumar</button>
      </div>
    </div>`).join('');
}
async function addPoints(dni){
  const input=document.getElementById(`pts-${dni}`);
  const val=parseInt(input.value);
  if(!val||val<1){toast('Ingresa una cantidad valida','error');return;}
  try{
    const[cur]=await sbGet('perfiles',`dni=eq.${encodeURIComponent(dni)}&limit=1`);
    const newPts=(cur.puntos||0)+val;
    await sbPatch('perfiles',`dni=eq.${encodeURIComponent(dni)}`,{puntos:newPts});
    document.getElementById(`pd-${dni}`).textContent=newPts;
    input.value='';
    toast(`+${val} puntos sumados!`,'success');
  }catch(e){toast('Error al actualizar','error');}
}
async function loadAdminCatalog(){
  const el=document.getElementById('admin-catalog-list');
  el.innerHTML='<span class="spinner"></span>';
  try{
    const rows=await sbGet('productos','order=categoria.asc,nombre.asc');
    if(!rows.length){el.innerHTML='<div class="empty-state">Sin productos aun.</div>';return;}
    el.innerHTML=rows.map(p=>`
      <div class="admin-product-item">
        ${p.imagen?`<img class="admin-thumb" src="${esc(p.imagen)}" alt="${esc(p.nombre)}" onerror="this.style.display='none'" />`:''}
        <div class="admin-product-info">
          <div class="admin-product-name">${esc(p.nombre)}</div>
          <div class="admin-product-meta">${esc(p.categoria)}${p.descripcion?' · '+esc(p.descripcion):''}</div>
        </div>
        <div class="admin-product-pts">${p.puntos}<small>pts</small></div>
        <button class="btn btn-danger" onclick="deleteProduct('${p.id}')">X</button>
      </div>`).join('');
  }catch(e){el.innerHTML='<div class="empty-state">Error al cargar.</div>';}
}
async function addProduct(){
  const nombre=document.getElementById('new-nombre').value.trim();
  const categoria=document.getElementById('new-categoria').value.trim();
  const puntos=parseInt(document.getElementById('new-puntos').value);
  const descripcion=document.getElementById('new-desc').value.trim();
  const imagen=document.getElementById('new-imagen').value.trim();
  if(!nombre||!categoria||!puntos){toast('Completa nombre, categoria y puntos','error');return;}
  try{
    await sbPost('productos',{nombre,categoria,puntos,descripcion:descripcion||null,imagen:imagen||null});
    ['new-nombre','new-categoria','new-puntos','new-desc','new-imagen'].forEach(id=>document.getElementById(id).value='');
    toast('Producto agregado!','success');
    loadAdminCatalog();
  }catch(e){toast('Error al agregar','error');console.error(e);}
}
async function deleteProduct(id){
  try{await sbDelete('productos',`id=eq.${id}`);toast('Producto eliminado','success');loadAdminCatalog();}
  catch(e){toast('Error al eliminar','error');}
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
</body>
</html>
