<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Club Fidelidad</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --wine: #7b1c2e;
    --wine-light: #a83248;
    --wine-dark: #4a0f1a;
    --accent: #c9a07a;
    --accent-light: #e8c9a8;
    --noir: #0e0608;
    --noir-card: #160a0d;
    --surface: #1f0f13;
    --border: rgba(123,28,46,0.3);
    --border-hover: rgba(123,28,46,0.6);
    --text: #f5ede8;
    --text-muted: #8a6a6e;
    --text-soft: #c8ada8;
    --success: #4caf7d;
    --error: #e05c5c;
    --radius: 2px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--noir); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(123,28,46,0.12) 0%, transparent 70%), repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(123,28,46,0.03) 40px), repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(123,28,46,0.03) 40px); pointer-events: none; z-index: 0; }
  #app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0 16px 60px; }
  header { width: 100%; max-width: 520px; text-align: center; padding: 40px 0 28px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
  .logo-ornament { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 10px; color: var(--accent); font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; font-weight: 500; }
  .logo-ornament::before, .logo-ornament::after { content: ''; height: 1px; width: 40px; background: linear-gradient(90deg, transparent, var(--accent)); }
  .logo-ornament::after { background: linear-gradient(90deg, var(--accent), transparent); }
  h1 { font-family: 'Playfair Display', serif; font-size: clamp(26px, 7vw, 38px); font-weight: 700; letter-spacing: 0.04em; background: linear-gradient(135deg, var(--accent-light), var(--accent), var(--wine-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.1; }
  .tagline { margin-top: 6px; font-size: 11px; letter-spacing: 0.3em; color: var(--text-muted); text-transform: uppercase; }
  .view { width: 100%; max-width: 520px; display: none; animation: fadeUp 0.35s ease; }
  .view.active { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .card { background: var(--noir-card); border: 1px solid var(--border); padding: 24px 20px; margin-bottom: 14px; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--wine-light), transparent); }
  .card-title { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 600; color: var(--accent-light); margin-bottom: 18px; letter-spacing: 0.02em; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
  input[type="text"], input[type="number"], input[type="password"] { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; padding: 11px 13px; border-radius: var(--radius); outline: none; transition: border-color 0.2s, box-shadow 0.2s; -webkit-appearance: none; }
  input:focus { border-color: var(--wine-light); box-shadow: 0 0 0 3px rgba(123,28,46,0.15); }
  input::placeholder { color: var(--text-muted); font-size: 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 20px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; border: none; border-radius: var(--radius); cursor: pointer; transition: all 0.2s; }
  .btn-primary { background: linear-gradient(135deg, var(--wine-dark), var(--wine), var(--wine-light)); color: var(--accent-light); }
  .btn-primary:hover { opacity: 0.9; }
  .btn-secondary { background: transparent; border: 1px solid var(--border-hover); color: var(--accent); }
  .btn-danger { background: transparent; border: 1px solid rgba(224,92,92,0.4); color: var(--error); font-size: 10px; padding: 7px 12px; width: auto; }
  .btn-ghost { background: transparent; color: var(--text-muted); font-size: 11px; padding: 10px; width: auto; letter-spacing: 0.1em; }
  .btn-ghost:hover { color: var(--accent); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .tabs { display: flex; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 20px; overflow: hidden; }
  .tab { flex: 1; padding: 11px; text-align: center; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; cursor: pointer; color: var(--text-muted); background: var(--noir-card); border: none; font-family: 'Inter', sans-serif; transition: all 0.2s; }
  .tab.active { background: linear-gradient(135deg, var(--wine-dark), var(--wine)); color: var(--accent-light); }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 13px; font-family: 'Inter', sans-serif; padding: 11px 22px; border-radius: var(--radius); box-shadow: 0 8px 32px rgba(0,0,0,0.5); z-index: 1000; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); max-width: 300px; text-align: center; white-space: nowrap; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success { border-color: rgba(76,175,125,0.5); color: var(--success); }
  #toast.error { border-color: rgba(224,92,92,0.5); color: var(--error); }
  .points-display { text-align: center; padding: 24px 16px; }
  .points-number { font-family: 'Playfair Display', serif; font-size: 68px; font-weight: 700; line-height: 1; background: linear-gradient(135deg, var(--accent-light), var(--wine-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .points-label { font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-muted); margin-top: 6px; }
  .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border-hover), transparent); margin: 18px 0; }
  .client-info-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-soft); padding: 5px 0; }
  .client-info-row strong { color: var(--text); font-weight: 500; }
  .section-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .section-tab { flex: 1; padding: 9px; text-align: center; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600; cursor: pointer; color: var(--text-muted); background: var(--noir-card); border: 1px solid var(--border); border-radius: var(--radius); font-family: 'Inter', sans-serif; transition: all 0.2s; }
  .section-tab.active { border-color: var(--wine-light); color: var(--accent); }
  .cat-group { margin-bottom: 20px; }
  .cat-header { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .product-item { display: flex; align-items: center; padding: 0; background: var(--surface); border: 1px solid var(--border); margin-bottom: 8px; border-radius: var(--radius); overflow: hidden; gap: 0; transition: border-color 0.2s; }
  .product-item:hover { border-color: var(--border-hover); }
  .product-img { width: 80px; height: 80px; object-fit: cover; flex-shrink: 0; }
  .product-img-placeholder { width: 80px; height: 80px; flex-shrink: 0; background: var(--noir-card); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 22px; }
  .product-body { flex: 1; padding: 12px; min-width: 0; }
  .product-name { font-size: 14px; color: var(--text); font-weight: 500; }
  .product-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .product-pts { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: var(--accent); white-space: nowrap; padding: 12px; text-align: right; }
  .product-pts small { font-family: 'Inter', sans-serif; font-size: 9px; color: var(--text-muted); display: block; letter-spacing: 0.1em; text-transform: uppercase; }
  #search-results { margin-top: 10px; }
  .profile-row { background: var(--surface); border: 1px solid var(--border); padding: 13px 14px; margin-bottom: 8px; border-radius: var(--radius); }
  .profile-row-top { display: flex; justify-content: space-between; align-items: center; }
  .profile-name { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 600; }
  .profile-dni { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .profile-points { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--accent); }
  .profile-points small { display: block; font-family: 'Inter', sans-serif; font-size: 9px; color: var(--text-muted); text-align: right; text-transform: uppercase; letter-spacing: 0.1em; }
  .add-pts-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .add-pts-row input { flex: 1; padding: 9px 11px; font-size: 14px; }
  .add-pts-row .btn { width: auto; padding: 9px 16px; font-size: 10px; }
  .admin-product-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 6px; border-radius: var(--radius); }
  .admin-product-info { flex: 1; min-width: 0; }
  .admin-product-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .admin-product-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .admin-product-pts { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--accent); font-weight: 700; white-space: nowrap; }
  .admin-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 2px; flex-shrink: 0; }
  .form-row { display: flex; gap: 8px; }
  .form-row .field { flex: 1; }
  .ornament { text-align: center; color: var(--accent); font-size: 16px; letter-spacing: 0.3em; margin: 6px 0; opacity: 0.5; }
  .spinner { width: 18px; height: 18px; border: 2px solid rgba(123,28,46,0.3); border-top-color: var(--wine-light); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { text-align: center; padding: 28px 16px; color: var(--text-muted); font-size: 13px; font-style: italic; font-family: 'Playfair Display', serif; }
  .top-bar { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .badge { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--border); padding: 4px 10px; font-weight: 600; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo-ornament">Programa exclusivo</div>
    <h1>Club Fidelidad</h1>
    <p class="tagline">Boutique &nbsp;·&nbsp; Privilegios</p>
  </header>

  <div class="view active" id="view-selector">
    <div class="tabs">
      <button class="tab" onclick="showView('view-client')">Soy Cliente</button>
      <button class="tab" onclick="promptAdmin()">Administrar</button>
    </div>
    <div class="ornament">— ✦ —</div>
  </div>

  <div class="view" id="view-client">
    <div class="card">
      <p class="card-title">Ingresá al club</p>
      <div class="field"><label>Número de DNI</label><input type="number" id="client-dni" placeholder="Ingresá tu DNI" /></div>
      <div class="field"><label>Tu nombre</label><input type="text" id="client-name" placeholder="Nombre completo" /></div>
      <button class="btn btn-primary" onclick="clientLogin()">Ingresar al club</button>
    </div>
    <div style="text-align:center;margin-top:4px;"><button class="btn btn-ghost" onclick="showView('view-selector')">← Volver</button></div>
  </div>

  <div class="view" id="view-profile">
    <div class="section-tabs">
      <button class="section-tab active" id="tab-mis-puntos" onclick="clientTab('mis-puntos')">Mis puntos</button>
      <button class="section-tab" id="tab-catalogo" onclick="clientTab('catalogo')">Catálogo</button>
    </div>
    <div id="panel-mis-puntos">
      <div class="card">
        <div class="points-display">
          <div class="points-number" id="profile-pts">0</div>
          <div class="points-label">Puntos acumulados</div>
        </div>
        <div class="divider"></div>
        <div class="client-info-row"><span>Nombre</span><strong id="profile-name-display">—</strong></div>
        <div class="client-info-row"><span>DNI</span><strong id="profile-dni-display">—</strong></div>
      </div>
    </div>
    <div id="panel-catalogo" style="display:none;">
      <div class="card">
        <p class="card-title">Productos & Beneficios</p>
        <div id="catalog-list"><div style="text-align:center;padding:20px;"><span class="spinner"></span></div></div>
      </div>
    </div>
    <div style="text-align:center;margin-top:4px;"><button class="btn btn-ghost" onclick="showView('view-client')">← Salir</button></div>
  </div>

  <div class="view" id="view-admin-login">
    <div class="card">
      <p class="card-title">Acceso Administrador</p>
      <div class="field"><label>Contraseña</label><input type="password" id="admin-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter') verifyAdmin()" /></div>
      <button class="btn btn-primary" onclick="verifyAdmin()">Ingresar</button>
    </div>
    <div style="text-align:center;margin-top:4px;"><button class="btn btn-ghost" onclick="showView('view-selector')">← Volver</button></div>
  </div>

  <div class="view" id="view-admin">
    <div class="top-bar">
      <span class="badge">✦ Admin</span>
      <button class="btn btn-ghost" style="width:auto;padding:6px 12px;" onclick="adminLogout()">Salir</button>
    </div>
    <div class="section-tabs">
      <button class="section-tab active" id="atab-clientes" onclick="adminTab('clientes')">Clientes</button>
      <button class="section-tab" id="atab-catalogo" onclick="adminTab('catalogo')">Catálogo</button>
    </div>
    <div id="apanel-clientes">
      <div class="card">
        <p class="card-title">Buscar cliente</p>
        <div class="field"><label>Nombre o DNI</label><input type="text" id="admin-search" placeholder="Escribí para buscar..." oninput="searchProfiles()" onkeydown="if(event.key==='Enter') searchProfiles(true)" /></div>
        <div id="search-results"></div>
      </div>
    </div>
    <div id="apanel-catalogo" style="display:none;">
      <div class="card">
        <p class="card-title">Agregar producto</p>
        <div class="field"><label>Nombre del producto</label><input type="text" id="new-nombre" placeholder="Ej: Malbec Reserva" /></div>
        <div class="form-row">
          <div class="field"><label>Categoría</label><input type="text" id="new-categoria" placeholder="Ej: Tintos" /></div>
          <div class="field"><label>Puntos</label><input type="number" id="new-puntos" placeholder="50" min="1" /></div>
        </div>
        <div class="field"><label>Descripción (opcional)</label><input type="text" id="new-desc" placeholder="Breve descripción..." /></div>
        <div class="field"><label>URL de imagen (opcional)</label><input type="text" id="new-imagen" placeholder="https://..." /></div>
        <button class="btn btn-primary" onclick="addProduct()">+ Agregar al catálogo</button>
      </div>
      <div class="card">
        <p class="card-title">Productos en catálogo</p>
        <div id="admin-catalog-list"><div style="text-align:center;padding:20px;"><span class="spinner"></span></div></div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const SB_URL="https://jskdumhuduxtyfzlrwcc.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impza2R1bWh1ZHV4dHlmemxyd2NjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NDI4ODksImV4cCI6MjA5MzMxODg4OX0.jWIrw0Szw7LzawUrhrNpySSEIHF5ttITjkbPrVkgnag";
const ADMIN_PASS="admin1234";
const H={"Content-Type":"application/json","apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`,"Prefer":"return=representation"};
async function sbGet(t,f=""){const r=await fetch(`${SB_URL}/rest/v1/${t}?${f}`,{headers:H});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbPost(t,b){const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:"POST",headers:H,body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbPatch(t,f,b){const r=await fetch(`${SB_URL}/rest/v1/${t}?${f}`,{method:"PATCH",headers:H,body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbDelete(t,f){const r=await fetch(`${SB_URL}/rest/v1/${t}?${f}`,{method:"DELETE",headers:H});if(!r.ok)throw new Error(await r.text());}
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');}
function promptAdmin(){showView('view-admin-login');document.getElementById('admin-pass').value='';}
let tt;
function toast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className=`show ${type}`;clearTimeout(tt);tt=setTimeout(()=>t.className='',3000);}
async function clientLogin(){
  const dni=document.getElementById('client-dni').value.trim();
  const name=document.getElementById('client-name').value.trim();
  if(!dni){toast('Ingresá tu DNI','error');return;}
  try{
    let[p]=await sbGet('perfiles',`dni=eq.${encodeURIComponent(dni)}&limit=1`);
    if(!p){if(!name){toast('Ingresá tu nombre para registrarte','error');return;}const res=await sbPost('perfiles',{dni,nombre:name,puntos:0});p=Array.isArray(res)?res[0]:res;toast('¡Bienvenido al club!','success');}
    document.getElementById('profile-pts').textContent=p.puntos??0;
    document.getElementById('profile-name-display').textContent=p.nombre||name;
    document.getElementById('profile-dni-display').textContent=p.dni;
    clientTab('mis-puntos');showView('view-profile');
  }catch(e){toast('Error de conexión','error');console.error(e);}
}
function clientTab(tab){
  document.getElementById('panel-mis-puntos').style.display=tab==='mis-puntos'?'block':'none';
  document.getElementById('panel-catalogo').style.display=tab==='catalogo'?'block':'none';
  document.getElementById('tab-mis-puntos').classList.toggle('active',tab==='mis-puntos');
  document.getElementById('tab-catalogo').classList.toggle('active',tab==='catalogo');
  if(tab==='catalogo')loadCatalog();
}
async function loadCatalog(){
  const el=document.getElementById('catalog-list');
  el.innerHTML='<div style="text-align:center;padding:20px;"><span class="spinner"></span></div>';
  try{
    const rows=await sbGet('productos','order=categoria.asc,nombre.asc');
    if(!rows.length){el.innerHTML='<div class="empty-state">El catálogo está vacío por ahora.</div>';return;}
    const groups={};
    rows.forEach(p=>{if(!groups[p.categoria])groups[p.categoria]=[];groups[p.categoria].push(p);});
    el.innerHTML=Object.entries(groups).map(([cat,prods])=>`
      <div class="cat-group">
        <div class="cat-header">${esc(cat)}</div>
        ${prods.map(p=>`
          <div class="product-item">
            ${p.imagen?`<img class="product-img" src="${esc(p.imagen)}" alt="${esc(p.nombre)}" onerror="this.style.display='none'" />`:`<div class="product-img-placeholder">✦</div>`}
            <div class="product-body">
              <div class="product-name">${esc(p.nombre)}</div>
              ${p.descripcion?`<div class="product-desc">${esc(p.descripcion)}</div>`:''}
            </div>
            <div class="product-pts">${p.puntos}<small>puntos</small></div>
          </div>`).join('')}
      </div>`).join('');
  }catch(e){el.innerHTML='<div class="empty-state">Error al cargar.</div>';}
}
function verifyAdmin(){
  if(document.getElementById('admin-pass').value===ADMIN_PASS){showView('view-admin');adminTab('clientes');toast('Bienvenido, Admin','success');}
  else{toast('Contraseña incorrecta','error');}
}
function adminLogout(){showView('view-selector');}
function adminTab(tab){
  document.getElementById('apanel-clientes').style.display=tab==='clientes'?'block':'none';
  document.getElementById('apanel-catalogo').style.display=tab==='catalogo'?'block':'none';
  document.getElementById('atab-clientes').classList.toggle('active',tab==='clientes');
  document.getElementById('atab-catalogo').classList.toggle('active',tab==='catalogo');
  if(tab==='catalogo')loadAdminCatalog();
}
let st;
function searchProfiles(now=false){clearTimeout(st);if(now){_doSearch();return;}st=setTimeout(_doSearch,320);}
async function _doSearch(){
  const q=document.getElementById('admin-search').value.trim();
  const el=document.getElementById('search-results');
  if(!q){el.innerHTML='';return;}
  el.innerHTML='<div style="text-align:center;padding:16px;"><span class="spinner"></span></div>';
  try{
    const isNum=/^\d+$/.test(q);
    const rows=isNum?await sbGet('perfiles',`dni=eq.${encodeURIComponent(q)}&order=nombre.asc`):await sbGet('perfiles',`nombre=ilike.*${encodeURIComponent(q)}*&order=nombre.asc&limit=20`);
    renderClients(rows);
  }catch(e){el.innerHTML='<div class="empty-state">Error al buscar.</div>';}
}
function renderClients(rows){
  const el=document.getElementById('search-results');
  if(!rows.length){el.innerHTML='<div class="empty-state">Sin resultados.</div>';return;}
  el.innerHTML=rows.map(p=>`
    <div class="profile-row">
      <div class="profile-row-top">
        <div><div class="profile-name">${esc(p.nombre)}</div><div class="profile-dni">DNI ${esc(p.dni)}</div></div>
        <div class="profile-points"><span id="pd-${esc(p.dni)}">${p.puntos??0}</span><small>puntos</small></div>
      </div>
      <div class="add-pts-row">
        <input type="number" id="pts-${esc(p.dni)}" placeholder="Puntos a sumar" min="1" onkeydown="if(event.key==='Enter') addPoints('${esc(p.dni)}')" />
        <button class="btn btn-secondary" style="width:auto;padding:9px 16px;font-size:10px;" onclick="addPoints('${esc(p.dni)}')">+ Sumar</button>
      </div>
    </div>`).join('');
}
async function addPoints(dni){
  const input=document.getElementById(`pts-${dni}`);
  const val=parseInt(input.value);
  if(!val||val<1){toast('Ingresá una cantidad válida','error');return;}
  try{
    const[cur]=await sbGet('perfiles',`dni=eq.${encodeURIComponent(dni)}&limit=1`);
    const newPts=(cur.puntos||0)+val;
    await sbPatch('perfiles',`dni=eq.${encodeURIComponent(dni)}`,{puntos:newPts});
    document.getElementById(`pd-${dni}`).textContent=newPts;
    input.value='';
    toast(`+${val} puntos sumados ✦`,'success');
  }catch(e){toast('Error al actualizar','error');}
}
async function loadAdminCatalog(){
  const el=document.getElementById('admin-catalog-list');
  el.innerHTML='<div style="text-align:center;padding:16px;"><span class="spinner"></span></div>';
  try{
    const rows=await sbGet('productos','order=categoria.asc,nombre.asc');
    if(!rows.length){el.innerHTML='<div class="empty-state">Sin productos aún.</div>';return;}
    el.innerHTML=rows.map(p=>`
      <div class="admin-product-item">
        ${p.imagen?`<img class="admin-thumb" src="${esc(p.imagen)}" alt="${esc(p.nombre)}" onerror="this.style.display='none'" />`:''}
        <div class="admin-product-info">
          <div class="admin-product-name">${esc(p.nombre)}</div>
          <div class="admin-product-meta">${esc(p.categoria)}${p.descripcion?' · '+esc(p.descripcion):''}</div>
        </div>
        <div class="admin-product-pts">${p.puntos}<small style="font-family:'Inter';font-size:9px;color:var(--text-muted);display:block;text-align:right;">pts</small></div>
        <button class="btn btn-danger" onclick="deleteProduct('${p.id}')">✕</button>
      </div>`).join('');
  }catch(e){el.innerHTML='<div class="empty-state">Error al cargar.</div>';}
}
async function addProduct(){
  const nombre=document.getElementById('new-nombre').value.trim();
  const categoria=document.getElementById('new-categoria').value.trim();
  const puntos=parseInt(document.getElementById('new-puntos').value);
  const descripcion=document.getElementById('new-desc').value.trim();
  const imagen=document.getElementById('new-imagen').value.trim();
  if(!nombre||!categoria||!puntos){toast('Completá nombre, categoría y puntos','error');return;}
  try{
    await sbPost('productos',{nombre,categoria,puntos,descripcion:descripcion||null,imagen:imagen||null});
    ['new-nombre','new-categoria','new-puntos','new-desc','new-imagen'].forEach(id=>document.getElementById(id).value='');
    toast('Producto agregado ✦','success');
    loadAdminCatalog();
  }catch(e){toast('Error al agregar','error');console.error(e);}
}
async function deleteProduct(id){
  try{await sbDelete('productos',`id=eq.${id}`);toast('Producto eliminado','success');loadAdminCatalog();}
  catch(e){toast('Error al eliminar','error');}
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
</body>
</html>
